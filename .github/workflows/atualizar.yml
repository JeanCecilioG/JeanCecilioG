name: Atualizar painel do perfil

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 06:00 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [gerar.mjs, perfil.json, arte/arte.json, .github/workflows/atualizar.yml]

permissions:
  contents: write

concurrency:
  group: atualizar-perfil
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar SVGs
        run: node gerar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar se mudou
        run: |
          if git diff --quiet -- perfil-escuro.svg perfil-claro.svg; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfil-escuro.svg perfil-claro.svg
          git commit -m "Atualiza as estatísticas do painel"
          git push
